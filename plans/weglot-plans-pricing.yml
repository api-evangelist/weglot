specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Weglot
providerId: weglot
created: '2026-06-21'
modified: '2026-06-21'
reconciled: true
tags:
- Translation
- Localization
- Internationalization
- Machine Translation
- Multilingual
- Plans
description: >-
  Weglot uses tiered subscription pricing metered on two dimensions: the number
  of translated words (counted once per unique word across the project, not per
  page view) and the number of translated languages included. Each plan bundles a
  word allowance and a language count; higher tiers raise both and unlock features
  such as professional human translators, translated URLs, statistics, custom
  languages, top-level domains, and enterprise security. A Free tier and a 14-day
  free trial (no credit card) are available, and accounts can opt into auto-upgrade
  to the next tier when limits are exceeded. Annual billing is offered at ~10x the
  monthly price (roughly two months free).
notes: >-
  Prices and allowances reflect the Weglot pricing page (USD, monthly billing) and
  are subject to change; verify current tiers, word allowances, and language counts
  on https://www.weglot.com/pricing during reconciliation.
sources:
- https://www.weglot.com/pricing
- https://developers.weglot.com/api/reference
plans:
- id: weglot-free
  name: Free
  type: free
  description: >-
    Entry tier for evaluating Weglot: 2,000 translated words into 1 language,
    with AI translation and glossary.
  entries:
  - label: Translated Words
    name: words
    type: limit
    metric: words
    limit: 2000
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  - label: Translated Languages
    name: languages
    type: limit
    metric: languages
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  elements:
  - name: AI Translation
  - name: Glossary
