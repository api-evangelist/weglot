meters:
- name: translated_words
  description: Unique words translated across a project, counted once regardless of page views, against the plan allowance.
  unit: words
  aggregation: sum
  dimensions:
  - project
  - plan
- name: translated_languages
  description: Number of target languages a project translates into, bounded by the plan.
  unit: languages
  aggregation: max
  dimensions:
  - project
  - plan
- name: subscription_fee
  description: Recurring per-tier subscription charge, billed monthly or annually.
  unit: currency
  aggregation: sum
  dimensions:
  - project
  - plan
principles:
- name: Visibility
  description: Track translated-word consumption versus the plan allowance in the Weglot dashboard statistics.
- name: Allocation
  description: Map each Weglot project/API key to the website or team it serves and to a cost center.
- name: Optimization
  description: Use a glossary and translation exclusions to avoid translating boilerplate; right-size the plan to actual word and language needs; prefer annual billing for stable workloads.
- name: Accountability
  description: Decide deliberately whether to enable auto-upgrade; review word burn against allowance before renewal to avoid unplanned tier jumps.
