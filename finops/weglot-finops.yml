description: >-
  FinOps view of Weglot spend. Weglot bills a recurring subscription per tier,
  where each tier bundles a translated-word allowance and a number of translated
  languages. The two cost drivers are unique translated words (counted once per
  project, not per page view) and the number of target languages. Exceeding a
  plan's word allowance halts new translations unless auto-upgrade is enabled, in
  which case spend steps up to the next tier. Annual billing reduces effective
  monthly cost (roughly two months free).
notes: >-
  Subscription prices and allowances are subject to change; verify against the
  Weglot pricing page during reconciliation.
