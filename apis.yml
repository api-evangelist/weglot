    type: Documentation
  - url: https://developers.weglot.com/api/reference
    type: APIReference
  - url: openapi/weglot-openapi.yml
    type: OpenAPI
  - url: collections/weglot.postman_collection.json
    type: PostmanCollection
  - url: collections/weglot.opencollection.json
    type: OpenCollection
  description: Translates an array of sentences from a source language to a target
    language via POST /translate, authenticated with an api_key query parameter.
    Each word carries a WordType classification (text, value, placeholder, meta,
    title, link, image) and an optional BotType so machine and human translations
    are reused consistently across a site.
