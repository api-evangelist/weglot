aid: weglot
url: https://raw.githubusercontent.com/api-evangelist/weglot/refs/heads/main/apis.yml
name: Weglot
kind: company
description: Weglot is a website translation platform that detects, translates, and
  displays multilingual content with no code changes. Its REST API at
  https://api.weglot.com powers machine and human translation of arrays of sentences
  between languages, exposes the catalog of supported languages, and is the same
  translation service used by the Weglot JavaScript, WordPress, Shopify, and CMS
  integrations.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Translation
- Localization
- Internationalization
- Machine Translation
- Multilingual
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: weglot:weglot-translate-api
  name: Weglot Translate API
  tags:
  - Translation
  - Machine Translation
  - Localization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.weglot.com/api/reference
  baseURL: https://api.weglot.com
  properties:
